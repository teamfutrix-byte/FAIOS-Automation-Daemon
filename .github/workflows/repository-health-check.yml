name: FAIOS Repository Health & Markdown Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  repository-health-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Audit Master Index Integrity
        run: |
          echo "Verifying MASTER-INDEX.md exists and is readable..."
          test -f MASTER-INDEX.md
          test -f ARCHITECTURE.md
          test -f DECISIONS.md

      - name: Verify Root Repository Structure
        run: |
          echo "Verifying all 13 FAIOS root directories exist..."
          test -d 00-Codex
          test -d 01-Blueprint
          test -d 02-Frameworks
          test -d 03-Executives
          test -d 04-Departments
          test -d 05-AI-Employees
          test -d 06-Skills
          test -d 07-SOP
          test -d 08-Automation
          test -d 09-Knowledge
          test -d 10-Templates
          test -d 11-Reports
          test -d 12-Deployment
